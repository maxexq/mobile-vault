# Posts PR activity, CI results and Vercel / Cloudflare Pages deploys to Discord (MV-96, MV-499).
# Setup: repo secret DISCORD_WEBHOOK_URL (Discord channel > Integrations > Webhooks).
# Optional repo variable SKIP_PREVIEW_SUCCESS=true mutes successful Preview deploys.
# Message logic: .github/scripts/discord-notify.sh
name: Discord notify

on:
  # _target runs the workflow from main, so it also has the secret for PRs from forks.
  # The default checkout for _target is the base branch, never the PR's code.
  pull_request_target:
    types: [opened, reopened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]
  # Vercel reports each Preview/Production deploy as a commit status named "Vercel".
  status:
  # Cloudflare Pages (MV-499, Git integration) reports each deploy as a check run named "Cloudflare Pages".
  check_run:
    types: [completed]
  # Kept for providers that create GitHub deployments instead.
  deployment_status:
  # CI workflows to report: put each new workflow's `name:` here. Scheduled runs and Error spike
  # are reported only when they fail (Error spike runs every 15 min and posts to its own channel).
  workflow_run:
    workflows: [Autotest, Web export, Release, Error spike, Sentry forward]
    types: [completed]
  # Actions tab > Discord notify > Run workflow: sends a test message.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    # other apps' check runs (only Cloudflare Pages deploys are news) don't start a runner
    if: github.event_name != 'check_run' || startsWith(github.event.check_run.name, 'Cloudflare Pages')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SKIP_PREVIEW_SUCCESS: ${{ vars.SKIP_PREVIEW_SUCCESS }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: bash .github/scripts/discord-notify.sh
