# Runs the Godot autotest on every PR into and push to main, uat and staging (MV-110, MV-112).
# The job is named "autotest": make it a required status check in the main / uat / staging ruleset
# so a red run blocks the merge. Discord notify (MV-96) reports it through workflow_run,
# which matches this workflow's `name:`, so keep it "Autotest".
# Run the same thing locally on Linux: bash tools/ci_autotest.sh
# The Godot steps are skipped (the "Need Godot?" step) when no changed file is part of the game
# (tools/ci_scope.sh, MV-173 / MV-549) or when this exact git tree already passed in an earlier run,
# e.g. the push after a merge or a promotion PR (MV-549). The job still reports success so the
# required check never sits on "pending". Don't use paths-ignore for that: a workflow that never
# starts leaves a required check waiting forever.
name: Autotest

on:
  pull_request:
    branches: [main, uat, staging]
  push:
    branches: [main, uat, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read # find earlier pass markers (artifacts) for this tree

concurrency:
  group: autotest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Godot 4.7.2-stable only (CLAUDE.md). The hash is from the release's SHA512-SUMS.txt.
  GODOT_VERSION: 4.7.2-stable
  GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  autotest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 1. Scope: a PR looks at its own files (not what merging the base brought in), a push at what
      #    it added since the previous head. No game file changed = no Godot (tools/ci_scope.sh).
      # 2. Tree: the Godot run leaves a marker artifact "autotest-pass-<tree>"; when one from this
      #    repository (never a fork) exists for this exact tree, the same files already passed.
      # Pushes to main and manual runs always run everything.
      - name: Need Godot?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          skip() { echo "godot=false" | tee -a "$GITHUB_OUTPUT"; echo "### Autotest: ⏭️ $1, Godot run skipped" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          if [ "$EVENT" = workflow_dispatch ] || [ "$REF" = refs/heads/main ]; then
            echo "godot=true" | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          files=
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
            files=$(git diff --name-only "$BEFORE" HEAD)
          fi
          [ "$(bash tools/ci_scope.sh <<<"$files")" = true ] || skip "no game files changed"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=autotest-pass-$tree&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)][0].workflow_run.id // empty")
          [ -z "$run" ] || skip "this exact tree already passed in [run $run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)"
          echo "godot=true" | tee -a "$GITHUB_OUTPUT"

      # BuildInfo.GAME_VERSION is semver and matches the web shell + CHANGELOG.md (MV-111)
      - name: Version check
        run: python3 tools/release.py check

      # Error spike alerts (MV-171): script with saved answers + the SQL on the runner's PostgreSQL
      - name: Error spike alert tests
        run: bash tools/test_error_spike.sh

      # GameAnalytics signing function (MV-426): api/ga.mjs against a fake GameAnalytics, no network
      - name: GameAnalytics proxy tests
        run: node tools/ga_proxy_test.mjs

      # Cloudflare Pages serves the engine from R2 (MV-499): web/index.wasm must be the build recorded in
      # config/engine_wasm.json, else a Godot upgrade would ship against the old upload
      - name: Engine wasm matches the R2 upload record
        run: node tools/engine_wasm_check.mjs

      - name: Cache Godot
        id: godot-cache
        if: steps.scope.outputs.godot == 'true'
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.scope.outputs.godot == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSLf -o "$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$GODOT_ZIP"
          echo "$GODOT_SHA512  $GODOT_ZIP" | sha512sum -c -
          unzip -q "$GODOT_ZIP" && rm "$GODOT_ZIP"

      - name: Install Godot
        if: steps.scope.outputs.godot == 'true'
        run: |
          sudo ln -sf ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version
          command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -yq xvfb)

      - name: Import assets
        if: steps.scope.outputs.godot == 'true'
        run: godot --headless --path . --import

      - name: Run autotest
        if: steps.scope.outputs.godot == 'true'
        env:
          OUT: ${{ runner.temp }}/autotest
          TIMEOUT: "1200"
        run: bash tools/ci_autotest.sh

      - name: Upload screenshots and log
        if: always() && steps.scope.outputs.godot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autotest-${{ github.run_number }}
          path: ${{ runner.temp }}/autotest
          retention-days: 7

      # Pass marker read by "Need Godot?" (MV-549): this tree passed, later runs on it can skip Godot
      - name: Mark this tree as passed
        if: success() && steps.scope.outputs.godot == 'true'
        run: echo "${{ steps.scope.outputs.tree }} ${{ github.sha }}" > "$RUNNER_TEMP/autotest-pass.txt"

      - name: Upload pass marker
        if: success() && steps.scope.outputs.godot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autotest-pass-${{ steps.scope.outputs.tree }}
          path: ${{ runner.temp }}/autotest-pass.txt
          retention-days: 30
          overwrite: true
