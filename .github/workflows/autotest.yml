# Runs the Godot autotest on every PR into and push to main, uat and staging (MV-110, MV-112).
# The job is named "autotest": make it a required status check in the main / uat / staging ruleset
# so a red run blocks the merge. Discord notify (MV-96) reports it through workflow_run,
# which matches this workflow's `name:`, so keep it "Autotest".
# Run the same thing locally on Linux: bash tools/ci_autotest.sh
# The Godot steps are skipped (the "Need Godot?" step) when no changed file is part of the game
# (tools/ci_scope.sh, MV-173 / MV-549) or when this exact git tree already passed in an earlier run,
# e.g. the push after a merge or a promotion PR (MV-549). The job still reports success so the
# required check never sits on "pending". Don't use paths-ignore for that: a workflow that never
# starts leaves a required check waiting forever.
# MV-779: PRs into staging (and pushes to staging) run only the --only=<group> runs that cover the
# changed files (tools/ci_select.py + tools/test_map.txt). PRs into uat / main, pushes to main and
# manual runs (unless they name groups) run everything. The whole autotest also runs every night at
# 05:00 Bangkok time on staging, uat and main: .github/workflows/nightly-autotest.yml.
name: Autotest

on:
  pull_request:
    branches: [main, uat, staging]
  push:
    branches: [main, uat, staging]
  workflow_dispatch:
    inputs:
      groups:
        description: "--only groups to run, space separated (empty = the whole autotest)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  actions: read # find earlier pass markers (artifacts) for this tree

concurrency:
  group: autotest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  autotest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2 # a PR's merge commit + its base parent: tools/ci_select.py reads the PR's diff

      # 1. Scope: a PR looks at its own files (not what merging the base brought in), a push at what
      #    it added since the previous head. No game file changed = no Godot (tools/ci_scope.sh).
      # 2. Tree: the Godot run leaves a marker artifact "autotest-pass-<tree>" (any passing run) and
      #    "autotest-full-<tree>" (the whole autotest passed); when one from this repository (never a fork)
      #    exists for this exact tree, the same files already passed. uat / main need the full marker.
      # 3. Which groups (MV-779): staging PRs and pushes run tools/ci_select.py on the changed files;
      #    "only" = space-separated --only groups, empty = the whole autotest.
      # Pushes to main and manual runs always run everything (a manual run can name groups instead).
      - name: Need Godot?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          REPO_ID: ${{ github.repository_id }}
          INPUT_GROUPS: ${{ inputs.groups }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          skip() { echo "godot=false" | tee -a "$GITHUB_OUTPUT"; echo "### Autotest: ⏭️ $1, Godot run skipped" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          run_all() { echo "godot=true" | tee -a "$GITHUB_OUTPUT"; echo "only=" >> "$GITHUB_OUTPUT"; echo "Autotest: whole suite ($1)"; exit 0; }
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$INPUT_GROUPS" ]; then
              echo "godot=true" | tee -a "$GITHUB_OUTPUT"; echo "only=$INPUT_GROUPS" | tee -a "$GITHUB_OUTPUT"; exit 0
            fi
            run_all "manual run"
          fi
          [ "$REF" != refs/heads/main ] || run_all "push to main"
          files=
          patch="$RUNNER_TEMP/autotest.patch"
          : > "$patch"
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            # HEAD is GitHub's test merge: base tip (HEAD^1) + this PR. Its diff from HEAD^1 is exactly the
            # PR's own change, with autotest.gd line numbers as in the tree that runs.
            files=$(git diff --name-only HEAD^1 HEAD)
            git diff HEAD^1 HEAD -- tools/autotest.gd > "$patch"
          elif [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            : # no merge commit to diff: tools/ci_select.py gets no patch and picks the full run for autotest.gd
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
            files=$(git diff --name-only "$BEFORE" HEAD)
            git diff "$BEFORE" HEAD -- tools/autotest.gd > "$patch"
          fi
          [ "$(bash tools/ci_scope.sh <<<"$files")" = true ] || skip "no game files changed"
          full_only=false
          if [ "$EVENT" = pull_request ] && [ "$BASE" != staging ]; then full_only=true; fi
          [ "$REF" = refs/heads/uat ] && full_only=true
          marker="autotest-pass-$tree"
          [ "$full_only" = false ] || marker="autotest-full-$tree"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$marker&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)][0].workflow_run.id // empty")
          [ -z "$run" ] || skip "this exact tree already passed in [run $run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)"
          [ "$full_only" = false ] || run_all "$([ "$EVENT" = pull_request ] && echo "PR into $BASE" || echo "push to uat")"
          # an empty file list (first push of a branch, unreadable diff) also gives the full run
          only=$(printf '%s\n' "$files" | python3 tools/ci_select.py --files - --patch "$patch" --explain)
          echo "godot=true" | tee -a "$GITHUB_OUTPUT"
          if [ "$only" = full ]; then only=; fi
          echo "only=$only" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Autotest scope (tools/ci_select.py)"
            echo
            if [ -n "$only" ]; then echo "Runs only: \`$only\` (the whole autotest runs nightly)"; else echo "Runs the whole autotest"; fi
            echo
            echo '<details><summary>why</summary>'
            echo
            echo '```'
            printf '%s\n' "$files" | python3 tools/ci_select.py --files - --patch "$patch" --explain 2>&1 >/dev/null | head -200
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # BuildInfo.GAME_VERSION is semver and matches the web shell + CHANGELOG.md (MV-111)
      - name: Version check
        run: python3 tools/release.py check

      # Error spike alerts (MV-171): script with saved answers + the SQL on the runner's PostgreSQL
      - name: Error spike alert tests
        run: bash tools/test_error_spike.sh

      # GameAnalytics signing function (MV-426): api/ga.mjs against a fake GameAnalytics, no network
      - name: GameAnalytics proxy tests
        run: node tools/ga_proxy_test.mjs

      # Cloudflare Pages serves the engine from R2 (MV-499): web/index.wasm must be the build recorded in
      # config/engine_wasm.json, else a Godot upgrade would ship against the old upload
      - name: Engine wasm matches the R2 upload record
        run: node tools/engine_wasm_check.mjs

      - name: Sentry forwarding tests (offline)
        run: python3 -m unittest discover -s tools/tests -p 'test_sentry_forward.py'

      - name: Set up Godot + import assets
        if: steps.scope.outputs.godot == 'true'
        uses: ./.github/actions/setup-godot

      - name: Run autotest
        if: steps.scope.outputs.godot == 'true'
        env:
          OUT: ${{ runner.temp }}/autotest
          TIMEOUT: "1200"
          ONLY: ${{ steps.scope.outputs.only }}
        run: bash tools/ci_autotest.sh

      - name: Upload screenshots and log
        if: always() && steps.scope.outputs.godot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autotest-${{ github.run_number }}
          path: ${{ runner.temp }}/autotest
          retention-days: 7

      # Pass marker read by "Need Godot?" (MV-549): this tree passed, later runs on it can skip Godot
      - name: Mark this tree as passed
        if: success() && steps.scope.outputs.godot == 'true'
        run: echo "${{ steps.scope.outputs.tree }} ${{ github.sha }}" > "$RUNNER_TEMP/autotest-pass.txt"

      - name: Upload pass marker
        if: success() && steps.scope.outputs.godot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autotest-pass-${{ steps.scope.outputs.tree }}
          path: ${{ runner.temp }}/autotest-pass.txt
          retention-days: 30
          overwrite: true

      # the whole autotest passed on this tree: uat / main PRs and the nightly run may skip it (MV-779)
      - name: Upload full-run pass marker
        if: success() && steps.scope.outputs.godot == 'true' && steps.scope.outputs.only == ''
        uses: actions/upload-artifact@v4
        with:
          name: autotest-full-${{ steps.scope.outputs.tree }}
          path: ${{ runner.temp }}/autotest-pass.txt
          retention-days: 30
          overwrite: true
